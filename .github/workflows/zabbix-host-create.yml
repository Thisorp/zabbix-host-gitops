name: Zabbix Host GitOps

on:
  pull_request:
    paths:
      - 'desired-state/hosts/**/*.json'
      - 'scripts/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/zabbix-host-create.yml'
  push:
    branches:
      - main
    paths:
      - 'desired-state/hosts/**/*.json'
      - 'scripts/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/zabbix-host-create.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run host creation against Zabbix'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: zabbix-host-gitops
  cancel-in-progress: false

jobs:
  validate:
    name: Validate host files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          import glob
          import sys

          files = sorted(glob.glob("desired-state/hosts/*.json"))
          if not files:
              print("No host files found")
              sys.exit(0)

          required_keys = ["host", "groups", "templates", "interfaces"]

          for f in files:
              with open(f, encoding="utf-8") as fh:
                  data = json.load(fh)

              for key in required_keys:
                  if key not in data:
                      raise Exception(f"{f}: missing key '{key}'")

              if not isinstance(data["groups"], list) or not data["groups"]:
                  raise Exception(f"{f}: groups must be a non-empty list")

              if not isinstance(data["templates"], list) or not data["templates"]:
                  raise Exception(f"{f}: templates must be a non-empty list")

              if not isinstance(data["interfaces"], list) or not data["interfaces"]:
                  raise Exception(f"{f}: interfaces must be a non-empty list")

              iface = data["interfaces"][0]
              for k in ["type", "main", "useip", "ip", "port"]:
                  if k not in iface:
                      raise Exception(f"{f}: interface missing '{k}'")

          print("Validation OK")
          PY

  plan:
    name: Plan new hosts
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    env:
      ZABBIX_URL: ${{ secrets.ZABBIX_URL }}
      ZABBIX_TOKEN: ${{ secrets.ZABBIX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Plan create-only
        run: |
          python - <<'PY'
          import json
          import glob
          from scripts.lib.zbx import get_host

          files = sorted(glob.glob("desired-state/hosts/*.json"))
          if not files:
              print("No host files found")
              raise SystemExit(0)

          for f in files:
              with open(f, encoding="utf-8") as fh:
                  data = json.load(fh)

              name = data["host"]
              if get_host(name):
                  print(f"[PLAN][SKIP] {name} already exists")
              else:
                  print(f"[PLAN][CREATE] {name}")
          PY

  apply:
    name: Apply create-only
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
    environment: production

    env:
      ZABBIX_URL: ${{ secrets.ZABBIX_URL }}
      ZABBIX_TOKEN: ${{ secrets.ZABBIX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create new hosts only
        run: |
          python scripts/sync_new_hosts.py
